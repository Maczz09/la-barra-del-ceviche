    image: ${REGISTRY:-ghcr.io/Maczz09/la-barra-del-ceviche}/servicio-facturacion:latest
    container_name: nachopps-servicio-facturacion
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    environment:
      PORT: '3000'
      DATABASE_URL: 'postgresql://${DB_USER:-nachopps}:${DB_PASS:?DB_PASS es obligatorio en produccion}@db-facturacion:5432/facturacion_db?schema=public'
      SERVICE_NAME: 'servicio-facturacion'
      SERVICE_AUD_ENFORCE: 'true'
      RABBITMQ_URI: 'amqp://${RABBITMQ_USER:-nachopps}:${RABBITMQ_PASS:?RABBITMQ_PASS es obligatorio en produccion}@rabbitmq:5672'
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY es obligatorio (PEM RS256, \n literales)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET es obligatorio (tokens S2S internos)}
      NODE_ENV: 'production'
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN es obligatorio, p.ej. https://app.tudominio.com}
      # SUNAT: opcionales a propósito (${VAR:-}, no ${VAR:?}) — el deploy no
      # debe fallar si aún no tienes certificado/SOL de una o ambas empresas.
      # Mientras falten, CertificadoService/EnvioProcessor lo detectan y ese
      # comprobante queda FIRMADO sin enviar (nunca se pierde, no gasta intentos).
      # Fallback de producción — coincide con .env.example. Si algún día se
      # necesita volver a homologación, sobreescribe SUNAT_WSDL_URL en .env
      # con la URL de e-beta.sunat.gob.pe (no toques este default).
      SUNAT_WSDL_URL: ${SUNAT_WSDL_URL:-https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService?wsdl}
      SUNAT_PFX_EMPRESA_1_FILE: ${SUNAT_PFX_EMPRESA_1_FILE:-}
      SUNAT_PFX_EMPRESA_1_PASS: ${SUNAT_PFX_EMPRESA_1_PASS:-}
      SUNAT_SOL_USER_EMPRESA_1: ${SUNAT_SOL_USER_EMPRESA_1:-}
      SUNAT_SOL_PASS_EMPRESA_1: ${SUNAT_SOL_PASS_EMPRESA_1:-}
      SUNAT_PFX_EMPRESA_2_FILE: ${SUNAT_PFX_EMPRESA_2_FILE:-}
      SUNAT_PFX_EMPRESA_2_PASS: ${SUNAT_PFX_EMPRESA_2_PASS:-}
      SUNAT_SOL_USER_EMPRESA_2: ${SUNAT_SOL_USER_EMPRESA_2:-}
      SUNAT_SOL_PASS_EMPRESA_2: ${SUNAT_SOL_PASS_EMPRESA_2:-}
      # Cifra las credenciales SUNAT cargadas por el formulario "Configurar
      # SUNAT" de Facturación — sin esto el formulario no puede guardar (pero
      # el servicio sigue andando con las 8 variables SUNAT_*_EMPRESA_<n>_*
      # de arriba). No bloquea el deploy si aún no se generó (${:-}).
      FACTURACION_CRED_ENCRYPTION_KEY: ${FACTURACION_CRED_ENCRYPTION_KEY:-}
    healthcheck:
      test: [ 'CMD', 'wget', '-qO-', 'http://localhost:3000/api/health/live' ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db-facturacion:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  servicio-compras:
    image: ${REGISTRY:-ghcr.io/Maczz09/la-barra-del-ceviche}/servicio-compras:latest
    container_name: nachopps-servicio-compras
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    environment:
      PORT: '3000'
      DATABASE_URL: 'postgresql://${DB_USER:-nachopps}:${DB_PASS:?DB_PASS es obligatorio en produccion}@db-compras:5432/compras_db?schema=public'
      SERVICE_NAME: 'servicio-compras'
      SERVICE_AUD_ENFORCE: 'true'
      RABBITMQ_URI: 'amqp://${RABBITMQ_USER:-nachopps}:${RABBITMQ_PASS:?RABBITMQ_PASS es obligatorio en produccion}@rabbitmq:5672'
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY es obligatorio (PEM RS256, \n literales)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?SERVICE_JWT_SECRET es obligatorio (tokens S2S internos)}
      NODE_ENV: 'production'
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN es obligatorio, p.ej. https://app.tudominio.com}
      COMPROBANTES_DIR: '/data/comprobantes'
      COMPROBANTE_MAX_BYTES: ${COMPROBANTE_MAX_BYTES:-12582912}
      COMPROBANTE_MAX_LADO: ${COMPROBANTE_MAX_LADO:-1600}
      COMPROBANTE_WEBP_QUALITY: ${COMPROBANTE_WEBP_QUALITY:-72}
    volumes:
      # Fotos de boletas/facturas de compra: deben entrar en la rutina de
      # backup junto a nachopps-backups (ver bloque de backups más abajo).
      - nachopps-comprobantes:/data/comprobantes
    healthcheck:
      test: [ 'CMD', 'wget', '-qO-', 'http://localhost:3000/api/health/live' ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db-compras:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ═══════════════════════════════════════════════════
  # FRONTEND (PWA)
  # ═══════════════════════════════════════════════════
  pwa-cliente:
    image: ${REGISTRY:-ghcr.io/Maczz09/la-barra-del-ceviche}/pwa-cliente:latest
    container_name: nachopps-pwa-cliente
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - '8080:8080'

  # ═══════════════════════════════════════════════════
  # KONG API GATEWAY (Punto único de acceso)
  # ═══════════════════════════════════════════════════
  kong:
    # Se construye y publica en GHCR vía .github/workflows/deploy.yml (igual
    # que los demás servicios) — sin `build:` acá para que Watchtower pueda
    # actualizarlo igual que a todos: comparando el digest de la imagen
    # publicada, no reconstruyéndolo localmente cada vez.
    image: ${REGISTRY:-ghcr.io/Maczz09/la-barra-del-ceviche}/kong:latest
    container_name: nachopps-kong
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped
    # Medido en dev (L2, 4 workers bajo meseta sostenida): 512m rozaba 97% y
    # perdía workers por OOM-kill. 768m es el mínimo probado que aguanta.
    mem_limit: 768m
    environment:
      KONG_DATABASE: 'off'
      # No exponer versión de Kong/nginx en cabeceras (hallazgo ZAP 10036)
      KONG_HEADERS: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # Admin API solo en loopback DENTRO del contenedor: inalcanzable desde la
      # red de Docker y desde el host. Para administrar: `docker exec` o túnel SSH.
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PLUGINS: 'bundled,jwt-cache'
      KONG_JWT_PUBLIC_KEY: ${KONG_JWT_PUBLIC_KEY:?KONG_JWT_PUBLIC_KEY es obligatorio (PEM RS256, \n literales)}
      KONG_RATE_LIMIT_MINUTE: ${KONG_RATE_LIMIT_MINUTE:-3000}
      KONG_RATE_LIMIT_HOUR: ${KONG_RATE_LIMIT_HOUR:-30000}
      # Dominio(s) https reales de la PWA. Obligatorio en producción.
      KONG_CORS_ORIGINS: ${KONG_CORS_ORIGINS:?KONG_CORS_ORIGINS es obligatorio, p.ej. ["https://app.tudominio.com"]}
      KONG_NGINX_HTTP_LUA_SHARED_DICT: 'jwt_cache 12m'
    ports:
      - '8000:8000'
      # La Admin API (8001) NO se publica en prod: queda en loopback interno.
    volumes:
      - ./kong/kong.yml.template:/tmp/kong.yml.template:ro
    healthcheck:
      test: [ 'CMD', 'kong', 'health' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ═══════════════════════════════════════════════════
  # OBSERVABILIDAD
  # ═══════════════════════════════════════════════════
  # OTel Collector real (contrib): recibe OTLP de los servicios y exporta a
  # Jaeger. Los servicios apuntan a http://otel-collector:4318 (sin cambios).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: nachopps-otel-collector
    command: [ '--config=/etc/otel-collector/otel-collector-config.yml' ]
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel-collector/otel-collector-config.yml:ro
    depends_on:
      - jaeger
    restart: unless-stopped
    mem_limit: 256m
    # Sin puertos al host: los servicios lo alcanzan por la red interna.

    # La imagen :latest corre como UID 10001 no-root; un volumen nombrado nuevo
    # se crea con dueño root, así que sin este init jaeger truena en el primer
    # deploy con "mkdir /badger/key: permission denied" (visto en el despliegue
    # real a la VPS del 2026-08-14). El compose de dev usa `user: root` como
    # atajo — en prod se evita correr el propio Jaeger como root, y en cambio
    # se corrige el dueño del volumen una sola vez antes de arrancarlo.
  jaeger-init:
    image: alpine:3
    container_name: nachopps-jaeger-init
    volumes:
      - jaeger_data:/badger
    command: [ 'chown', '-R', '10001:10001', '/badger' ]
    restart: 'no'
    mem_limit: 64m

  # Backend de trazas persistente (Badger en volumen). UI 16686 solo por red
  # interna / túnel SSH (sin publicar al host en prod).
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: nachopps-jaeger
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    environment:
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: 'false'
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger_data:/badger
    restart: unless-stopped
    # Badger reserva ~256m solo de BlockCache + tablas al abrir; con 512m
    # entraba en OOM-loop (exit 137) en dev. 1g es el mínimo probado.
    mem_limit: 1g

  prometheus:
    image: prom/prometheus:latest
    container_name: nachopps-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      # Persistencia de exemplars (trace_id) para el salto métrica→Jaeger.
      - '--enable-feature=exemplar-storage'
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:latest
    container_name: nachopps-alertmanager
    # Instancia única, sin peers de cluster configurados: sin esto el gossip
    # mesh puede fallar a arrancar ("no private IP found") en algunos hosts.
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address='
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: nachopps-grafana
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS:?GRAFANA_PASS es obligatorio en produccion}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  # Backups de las 9 BDs (plan 3.5): pg_dump diario + retención. Para almacenar
  # fuera del host, montar un bind a un volumen de red/objeto o sincronizar
  # nachopps-backups a S3 con un job aparte.
  db-backup:
    image: postgres:16-alpine
    container_name: nachopps-db-backup
    environment:
      DB_USER: ${DB_USER:-nachopps}
      DB_PASS: ${DB_PASS:?DB_PASS es obligatorio en produccion}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_DIR: /backups
    volumes:
      - ../scripts/backup-postgres.sh:/usr/local/bin/backup.sh:ro
      - nachopps-backups:/backups
    entrypoint: [ '/bin/sh', '-c', 'while true; do sh /usr/local/bin/backup.sh || echo "[db-backup] ciclo con fallos"; sleep 86400; done' ]
    restart: unless-stopped
    mem_limit: 256m

  watchtower:
    image: containrrr/watchtower:latest
    container_name: nachopps-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      - DOCKER_API_VERSION=1.40
    # --label-enable: solo toca contenedores con el label
    # com.centurylinklabs.watchtower.enable=true (los 13 que publica
    # .github/workflows/deploy.yml). Sin esto, Watchtower actualiza CUALQUIER
    # contenedor del host — incluidas las 11 bases Postgres, RabbitMQ,
    # Grafana, etc. — apenas Docker Hub publique un nuevo build de esas
    # imágenes, reiniciándolas sin aviso. Nada de eso lo construye este repo;
    # no debe auto-actualizarse solo.
    command: --interval 300 --cleanup --label-enable
    restart: unless-stopped
    mem_limit: 128m

volumes:
  nachopps-backups: # Observabilidad persistente.

  prometheus_data:
  grafana_data:
  jaeger_data:
  nachopps-db-reservas:
  nachopps-db-mesas:
  nachopps-db-pedidos:
  nachopps-db-cuentas:
  nachopps-db-inventario:
  nachopps-db-caja:
  nachopps-db-reportes:
  nachopps-db-facturacion:
  nachopps-db-compras: # Fotos de boletas/facturas de compra (WebP + miniatura). Debe entrar en la

  # rutina de backup junto a nachopps-backups.
  nachopps-comprobantes:
  nachopps-db-identidad:
  nachopps-db-notificaciones:
