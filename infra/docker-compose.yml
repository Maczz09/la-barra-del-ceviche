    image: la-barra-del-ceviche-servicio-facturacion
    container_name: nachopps-servicio-facturacion
    ports: ['3011:3000']
    # sunat-dev.env es opcional a proposito (required: false): igual que el
    # .p12 del volumen de abajo, no existe en un checkout fresco (CI, otro
    # dev) — el servicio ya esta preparado para arrancar "no configurado"
    # (ver SunatConfigService) y sin esto docker compose up fallaba entero
    # por un env_file requerido inexistente.
    env_file:
      - *jwt_dev_env
      - path: ./secrets/sunat-dev.env
        required: false
    volumes:
      - ../certificates:/app/certificates:ro
    environment:
      PORT: '3000'
      NODE_OPTIONS: '--max-old-space-size=400'
      RMQ_PREFETCH: '5'
      PG_POOL_MAX: '40'
      PG_TX_MAXWAIT_MS: '30000'
      PG_POOL_CONN_TIMEOUT_MS: '30000'
      OUTBOX_BATCH_SIZE: '200'
      DATABASE_URL: 'postgresql://nachopps:secret@db-facturacion:5432/facturacion_db?schema=public'
      SERVICE_NAME: 'servicio-facturacion'
      SERVICE_AUD_ENFORCE: 'true'
      RABBITMQ_URI: 'amqp://nachopps:nachopps_secret@rabbitmq:5672'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
      SERVICE_JWT_SECRET: 'nachopps_service_secret_dev'
      CORS_ORIGIN: 'http://localhost:4200'
      # SUNAT: credenciales de empresa 1 (Sede Central, RUC 20123456786) desde
      # infra/secrets/sunat-dev.env (gitignorado); el .p12 se monta como
      # volumen desde certificates/ (también gitignorado, nunca en la imagen).
      # Empresa 2 queda "no configurada" hasta tramitar su propio certificado
      # — CertificadoService/EnvioProcessor lo detectan sin tumbar el resto.
      # A propósito en BETA/homologación, aunque prod ya usa el endpoint real
      # (ver .env.example) — este stack es para desarrollo local; nunca debe
      # poder enviar un comprobante real a SUNAT solo por estar probando algo.
      SUNAT_WSDL_URL: 'https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService?wsdl'
      SUNAT_PFX_EMPRESA_1_FILE: '/app/certificates/empresa-1/certificado.p12'
      # Cifra las credenciales SUNAT que se suban por el formulario "Configurar
      # SUNAT" de Facturación (ver CredencialesCryptoService) — 32 bytes hex,
      # SOLO de dev. En prod, un secret real generado con
      # `node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"`.
      FACTURACION_CRED_ENCRYPTION_KEY: '165525fec81a294571de597b1110d6b17e5060da219c87dcb865da257e7f0d69'
    profiles: ['all']
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db-facturacion:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

