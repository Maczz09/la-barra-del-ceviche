  # ═══════════════════════════════════════════════════
  # MICROSERVICIOS
  # ═══════════════════════════════════════════════════
  servicio-identidad:
    image: la-barra-del-ceviche-servicio-identidad
    container_name: nachopps-servicio-identidad
    # host 3001 choca con otro stack Docker de este host (medicitas_grafana);
    # Kong sigue enrutando internamente a servicio-identidad:3000, sin cambios.
    ports: ['3021:3000']
    env_file: *jwt_dev_env
    environment:
      PORT: '3000'
      NODE_OPTIONS: '--max-old-space-size=400'
      # Hallazgo de carga (2026-07-13): prefetch 20 > pool pg de 10 → bajo
      # tormenta de eventos (pedidos L1) los consumidores no consiguen iniciar
      # transacción (P2028), agotan los 3 reintentos y mandan miles de mensajes
      # a la DLQ. Con 5, los mensajes esperan en el broker (backpressure
      # durable) en vez de morir: en vuelo ≤ 5 conexiones, quedan 5 para HTTP.
      RMQ_PREFETCH: '5'
      # Hallazgo de carga (2026-07-13): con pool=10, 1000 escrituras concurrentes
      # → P2028 (transacción no consigue conexión) → ~10k respuestas 500 en L1.
      # 25 por servicio deja margen amplio frente a max_connections=100 de su
      # Postgres dedicado (1 servicio por BD + crons de outbox/purga).
      PG_POOL_MAX: '40'
      # Medido en L1 final: con maxWait 10s quedaba un tail de 5.4% de P2028 en
      # pedidos (~150 escritores concurrentes). 30s convierte ese tail en
      # respuestas lentas (backpressure) en vez de 500; 40 conexiones suben el
      # ritmo de servicio de tx (Postgres dedicado: max_connections=100).
      PG_TX_MAXWAIT_MS: '30000'
      # Medido: el connectionTimeoutMillis del pg.Pool (5s, B-1) salta ANTES que
      # el maxWait de Prisma cuando los GETs concurrentes retienen las 40
      # conexiones (sort de listados sin índice) → P2028 en escrituras. En
      # sesión de carga: esperar = backpressure; 5s solo tiene sentido con
      # tráfico normal.
      PG_POOL_CONN_TIMEOUT_MS: '30000'
      # B-5: 200 ev/s de drenado por productor (el default de 50 dejaba backlogs
      # de >10 min tras ráfagas de escritura de los niveles L2/L3).
      OUTBOX_BATCH_SIZE: '200'
      DATABASE_URL: 'postgresql://nachopps:secret@db-identidad:5432/identidad_db?schema=public'
      SERVICE_NAME: 'servicio-identidad'
      SERVICE_AUD_ENFORCE: 'true'
      RABBITMQ_URI: 'amqp://nachopps:nachopps_secret@rabbitmq:5672'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
      SERVICE_JWT_SECRET: 'nachopps_service_secret_dev'
      CORS_ORIGIN: 'http://localhost:4200'
      # Parametrizable: la suite k6 (stress-tests/k6) sube esto en la sesión de
      # pruebas (JWT_EXPIRES_IN=60m) para que el token no caduque a mitad de un
      # run L2/L3 largo. Default sin cambios para uso normal.
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_TTL_DAYS: '7'
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: 'strict'
    profiles: ['all']
    restart: unless-stopped # A-4: paridad con prod; `docker compose stop` manual sigue funcionando
    # Hallazgo de carga (2026-07-13): sin mem_limit, un contenedor que crece
    # bajo saturación puede agotar el presupuesto compartido de la VM de Docker
    # Desktop (~7.7GB) y arrastrar a los 9 Postgres consigo (visto en runtime:
    # los 9 db-* murieron a la vez, exit 255, sin OOM de cgroup individual).
    # 512m×9 servicios: la suma debe caber en la VM de Docker Desktop (~7.7GB);
    # con 768m la VM entera murió dos veces bajo L1 de pedidos (fan-out de
    # escrituras). NODE_OPTIONS fuerza a V8 a hacer GC antes del cap del cgroup
    # (V8 no siempre respeta límites de contenedor) → presión de GC en vez de
    # OOM-kill.
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db-identidad:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  servicio-mesas:
    image: la-barra-del-ceviche-servicio-mesas
    container_name: nachopps-servicio-mesas
    ports: ['3002:3000']
