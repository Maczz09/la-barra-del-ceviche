    image: la-barra-del-ceviche-servicio-compras
    container_name: nachopps-servicio-compras
    ports: ['3012:3000']
    env_file: *jwt_dev_env
    environment:
      PORT: '3000'
      # 320 y no 400 como el resto: sharp/libvips asigna FUERA del heap de V8.
      # Con 400 + arena nativo el cgroup de 512m mata el contenedor al procesar
      # una foto grande.
      NODE_OPTIONS: '--max-old-space-size=320'
      RMQ_PREFETCH: '5'
      # 15 y no 40: servicio de baja concurrencia (solo ADMIN/GERENCIA/SISTEMA),
      # sin consumidores de eventos. No hace falta reservar 40 conexiones.
      PG_POOL_MAX: '15'
      PG_TX_MAXWAIT_MS: '30000'
      PG_POOL_CONN_TIMEOUT_MS: '30000'
      OUTBOX_BATCH_SIZE: '200'
      DATABASE_URL: 'postgresql://nachopps:secret@db-compras:5432/compras_db?schema=public'
      SERVICE_NAME: 'servicio-compras'
      SERVICE_AUD_ENFORCE: 'true'
      RABBITMQ_URI: 'amqp://nachopps:nachopps_secret@rabbitmq:5672'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
      SERVICE_JWT_SECRET: 'nachopps_service_secret_dev'
      CORS_ORIGIN: 'http://localhost:4200'
      COMPROBANTES_DIR: '/data/comprobantes'
      COMPROBANTE_MAX_BYTES: '12582912' # 12 MB antes de comprimir
      COMPROBANTE_MAX_LADO: '1600'
      COMPROBANTE_WEBP_QUALITY: '72'
    profiles: ['all']
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - nachopps-comprobantes:/data/comprobantes
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db-compras:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ═══════════════════════════════════════════════════
  # KONG API GATEWAY (con jwt-cache)
  # ═══════════════════════════════════════════════════
  kong:
    build:
      context: kong
      dockerfile: Dockerfile
    image: la-barra-del-ceviche-kong
    container_name: nachopps-kong
    env_file: *jwt_dev_env
    environment:
      KONG_DATABASE: 'off'
      # No exponer versión de Kong/nginx en cabeceras (hallazgo ZAP 10036)
      KONG_HEADERS: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PLUGINS: 'bundled,jwt-cache'
      KONG_RATE_LIMIT_MINUTE: ${KONG_RATE_LIMIT_MINUTE:-3000}
      KONG_RATE_LIMIT_HOUR: ${KONG_RATE_LIMIT_HOUR:-30000}
      KONG_CORS_ORIGINS: ${KONG_CORS_ORIGINS:-["http://localhost:4200","http://localhost:4201","http://localhost:5173","http://127.0.0.1:4200","http://127.0.0.1:4201","http://127.0.0.1:5173"]}
      KONG_NGINX_HTTP_LUA_SHARED_DICT: 'jwt_cache 12m'
      # Medido 2026-07-13: con `auto`, nginx levanta 1 worker/CPU (12) y el
      # conjunto no cabe en el mem_limit → el kernel mata workers (signal 9) y
      # Kong se recicla en plena carga. 4 workers sobran para este throughput.
      KONG_NGINX_WORKER_PROCESSES: '4'
      # Compras sube fotos de comprobante (request-size-limiting del servicio
      # ya limita a 16 MB; esto evita que el default de nginx de Kong corte
      # antes con un 413 sin cuerpo informativo).
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: '16m'
    ports:
      - '8000:8000'
      - '8001:8001'
    volumes:
      - ./kong/kong.yml.template:/tmp/kong.yml.template:ro
    profiles: ['infra', 'all', 'dev']
    restart: unless-stopped # la VM de Docker Desktop murió bajo carga: el gateway debe autolevantar
    # 768m (medido en L2: con 512m el gateway rozaba el 97% con 4 workers y
    # perdía workers por OOM-kill bajo meseta sostenida).
    mem_limit: 768m
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ═══════════════════════════════════════════════════
  # OBSERVABILIDAD
  # ═══════════════════════════════════════════════════
  # OTel Collector real (contrib): recibe OTLP de los 9 servicios (grpc 4317 /
  # http 4318) y exporta las trazas a Jaeger. Los servicios siguen apuntando a
  # http://otel-collector:4318, así que no cambia código de aplicación.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: nachopps-otel-collector
    command: ['--config=/etc/otel-collector/otel-collector-config.yml']
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel-collector/otel-collector-config.yml:ro
    # host 4317/4318 chocan con otro stack Docker de este host (medicitas_jaeger);
    # remapeados solo del lado host. Los servicios apuntan a
    # http://otel-collector:4318 (nombre de red interno), sin cambios.
    ports:
      - '4328:4318'
      - '4327:4317'
    depends_on:
      - jaeger
    profiles: ['infra', 'all', 'dev']
    restart: unless-stopped
    mem_limit: 256m

  # Backend de trazas con almacenamiento persistente (Badger en volumen): las
  # trazas y la UI (16686) sobreviven reinicios. Antes era all-in-one en memoria.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: nachopps-jaeger
    # La imagen :latest pasó a correr como UID 10001 no-root; el volumen nombrado
    # se crea con dueño root y el proceso no puede mkdir /badger/key ni /badger/data.
    # ponytail: root en dev alcanza (SOLO DESARROLLO, ver cabecera del archivo); si
    # esto pasa a prod, fijar el volumen con la UID 10001 en vez de correr como root.
    user: root
    environment:
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: 'false'
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    # host 16686 choca con otro stack Docker de este host (medicitas_jaeger).
    ports:
      - '16687:16686'
    volumes:
      - jaeger_data:/badger
    profiles: ['infra', 'all', 'dev']
    restart: unless-stopped
    # Badger reserva 256m solo de BlockCache + 185 tablas al abrir; con 512m
    # la DB acumulada no entraba y el kernel lo mataba por OOM (exit 137) en bucle.
    mem_limit: 1g

  prometheus:
    image: prom/prometheus:latest
    container_name: nachopps-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      # Almacena los exemplars scrapeados (trace_id embebido en los histogramas
      # OpenMetrics de los servicios); sin este flag Prometheus los descarta y
      # el salto métrica→traza en Grafana queda vacío.
      - '--enable-feature=exemplar-storage'
    # host 9090 choca con otro stack Docker de este host (medicitas_prometheus).
    ports:
      - '9091:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    profiles: ['infra', 'all', 'dev']
    restart: unless-stopped
    mem_limit: 512m

  alertmanager:
    image: prom/alertmanager:latest
    container_name: nachopps-alertmanager
    # Instancia única, sin peers de cluster configurados: en algunos hosts
    # Docker Desktop no puede deducir una IP privada para el gossip mesh
    # ("no private IP found") y el proceso muere en loop de restart.
    # --cluster.listen-address='' apaga el clustering (innecesario aquí).
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address='
    # host 9093 choca con otro stack Docker de este host (medicitas_alertmanager).
    ports:
      - '9095:9093'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    profiles: ['infra', 'all', 'dev']
    restart: unless-stopped
    mem_limit: 128m

  grafana:
    image: grafana/grafana:latest
    container_name: nachopps-grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    profiles: ['infra', 'all', 'dev']
    restart: unless-stopped
    mem_limit: 384m

  # Agregación de logs estructurados (plan 5.1): Loki almacena, Promtail recoge
  # el stdout JSON (con trace_id/correlationId) de los contenedores.
  loki:
    image: grafana/loki:2.9.0
    container_name: nachopps-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - '3100:3100'
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    profiles: ['infra', 'all', 'dev']
    restart: unless-stopped
    mem_limit: 384m

  promtail:
    image: grafana/promtail:2.9.0
    container_name: nachopps-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    profiles: ['infra', 'all', 'dev']
    restart: unless-stopped
    mem_limit: 128m

  pwa-cliente:
    build:
      context: ../
      dockerfile: apps/pwa-cliente/Dockerfile
    image: la-barra-del-ceviche-pwa-cliente
    container_name: nachopps-pwa-cliente
    ports:
      - '4200:8080'
    profiles: ['all']
    restart: unless-stopped
    mem_limit: 128m

volumes:
  nachopps-db-reservas:
  nachopps-db-mesas:
  nachopps-db-pedidos:
  nachopps-db-cuentas:
  nachopps-db-facturacion:
  nachopps-db-compras:
  # Fotos de boletas/facturas de compra (WebP + miniatura). Persiste a
  # `docker compose down`; NO va a la BD para no arrastrar blobs por el heap.
  nachopps-comprobantes:
  nachopps-db-inventario:
  nachopps-db-caja:
  nachopps-db-reportes:
  nachopps-db-identidad:
  nachopps-db-notificaciones:
  # Observabilidad persistente (sobrevive a `docker compose down`).
  prometheus_data:
  grafana_data:
  loki_data:
  jaeger_data:
