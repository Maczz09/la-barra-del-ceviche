x-jwt-dev-env: &jwt_dev_env ./secrets/jwt-dev.env

# SOLO DESARROLLO. Credenciales debiles a proposito (postgres `secret`,
# admin `nachopps123`, `SERVICE_JWT_SECRET` fijo). NUNCA usar este archivo en
# un VPS/host publico; produccion usa docker-compose.prod.yml + .env real.
services:
  # ═══════════════════════════════════════════════════
  # INFRAESTRUCTURA COMPARTIDA
  # ═══════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3-management
    container_name: nachopps-rabbitmq
    # A-4: sin mem_limit el memory watermark del broker (40 % de la RAM) depende
    # del host → backpressure irreproducible en pruebas. 1g fija el umbral en ~400MB.
    mem_limit: 1g
    restart: unless-stopped # la VM de Docker Desktop murió bajo carga: el broker debe autolevantar
    ports:
      # A-4/host: 5672/15672 chocan con otro stack Docker de este host
      # (medicitas_rabbitmq); remapeados solo del lado host. La comunicación
      # interna entre servicios sigue usando `rabbitmq:5672` (red de Docker),
      # no se ve afectada.
      - '5674:5672'
      - '15674:15672'
      - '15692:15692' # A-2: métricas Prometheus del broker
    environment:
      RABBITMQ_DEFAULT_USER: nachopps
      RABBITMQ_DEFAULT_PASS: nachopps_secret
    volumes:
      # A-2: habilita rabbitmq_prometheus (profundidad de colas/DLQ visible en Grafana)
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    profiles: ['infra', 'all', 'dev']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_running']
      interval: 10s
      timeout: 5s
      retries: 5

  # BASES DE DATOS
  db-reservas:
    image: postgres:16-alpine
    container_name: nachopps-db-reservas
    environment:
      POSTGRES_USER: nachopps
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: reservas_db
    ports: ['5441:5432']
    profiles: ['infra', 'all', 'dev']
    # Hallazgo de carga (2026-07-13): sin restart, una caída por presión de
    # memoria del host deja al servicio dueño en loop de "Database not ready"
    # indefinido — el resto del stack sí se autorecupera, la BD no lo hacía.
    # mem_limit contiene el fallo a UN contenedor en vez de arrastrar a los 9.
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - nachopps-db-reservas:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nachopps -d reservas_db']
      interval: 5s
      timeout: 3s
      retries: 5

