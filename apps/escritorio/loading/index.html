<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>La Barra del Ceviche</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#123c58,#061427 52%,#020711);color:#f7fbff;font:500 15px system-ui,sans-serif}.card{text-align:center}.logo{width:148px;height:148px;border-radius:32px;box-shadow:0 24px 70px #0008}.dots{display:flex;justify-content:center;gap:7px;margin:26px}.dots i{width:7px;height:7px;border-radius:50%;background:#58e4ea;animation:p 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes p{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-5px)}}h1{font-size:21px;margin:0 0 8px}p{margin:0;color:#a9bdcf}.credit{display:block;margin-top:28px;color:#70869a;font-size:11px;max-width:340px;line-height:1.5}
    </style>
  </head>
  <body><main class="card"><img class="logo" src="icon-source.png" alt="La Barra del Ceviche"/><div class="dots"><i></i><i></i><i></i></div><h1>Iniciando servidor local</h1><p>Preparando carta, pedidos, cocina y caja…</p><small class="credit">Basado en RestoApp del Ingeniero en Sistemas e Informática Max Alessandro García López.</small></main></body>
</html>
